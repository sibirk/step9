<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Температура</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 50%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #f4f4f4; }
        form { margin-top: 20px; background: #f9f9f9; padding: 15px; width: 50%; border: 1px solid #ddd; }
        input { padding: 8px; margin: 5px 0; width: calc(100% - 18px); }
    </style>
</head>
<body>
    <h1>Данные о температуре</h1>

    <form id="weatherForm">
        <h3>Добавить запись</h3>
        <label>Дата:</label><br>
        <input type="date" id="dateInput" required><br>
        <label>Температура (°C):</label><br>
        <input type="number" step="0.1" id="tempInput" required><br>
        <button type="submit">Сохранить</button>
    </form>

    <table>
        <tr>
            <th>Дата</th>
            <th>Температура</th>
        </tr>
        {% for row in rows %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }} °C</td>
        </tr>
        {% endfor %}
    </table>

    <script>
        document.getElementById('weatherForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const date = document.getElementById('dateInput').value;
            const temp = document.getElementById('tempInput').value;

            // Отправляем данные как query-параметры без использования multipart/form-data
            fetch(`/add?date=${encodeURIComponent(date)}&temperature=${encodeURIComponent(temp)}`, {
                method: 'POST'
            }).then(() => {
                window.location.reload();
            });
        });
    </script>
</body>
</html>
