meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  persistenceMount: /data
  command: gunicorn --bind 0.0.0.0:80 main:app
  containerPort: 80
  russianTrustedCa: false
  singleton: false
  zeroDowntime: true
