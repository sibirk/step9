meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  scriptName: null
  command: gunicorn --bind 0.0.0.0:80 --workers 1 --worker-class gthread --threads 4 --timeout 1800 main:app
  persistenceMount: /data
  containerPort: 80
  russianTrustedCa: false
  singleton: false
  zeroDowntime: true
